name: Deploy to server

# Деплой статического сайта из каталога site/ на сервер по SSH силами раннеров GitHub.
# Caddy ставится через apt и отдаёт содержимое site/ по HTTPS с автоматическим
# сертификатом Let's Encrypt. Docker не используется (тянуть образы с Docker Hub
# на этом сервере нестабильно).
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SERVER_HOST        — IP/домен сервера (например 91.212.150.225)  [обязательно]
#   SERVER_PASSWORD    — пароль SSH                                   [обязательно]
#   SERVER_USER        — пользователь SSH (по умолчанию root)         [опционально]
#   SERVER_PORT        — порт SSH (по умолчанию 22)                   [опционально]
#   DUCKDNS_SUBDOMAIN  — метка на duckdns.org БЕЗ суффикса            [опционально,
#   DUCKDNS_TOKEN      — токен с дашборда duckdns.org                  для авто-DNS]
#   ACME_EMAIL         — почта для уведомлений Let's Encrypt          [опционально]

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать на сервере"
        type: choice
        options: [deploy, inspect]
        default: deploy

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  # Как получать домен под сертификат:
  #   fixed   — домен берётся из SITE_DOMAIN_FIXED ниже. A-запись должна вести
  #             на сервер; секреты не нужны. Это текущий режим.
  #   sslip   — домен выводится из IP сервера (91.212.150.225 → 91-212-150-225.sslip.io).
  #   duckdns — используется <DUCKDNS_SUBDOMAIN>.duckdns.org из секретов.
  #   off     — без TLS, сайт отдаётся только по HTTP на порту 80.
  TLS_MODE: fixed
  SITE_DOMAIN_FIXED: raikhin.duckdns.org

jobs:
  # ── DEPLOY: выложить содержимое site/ на сервер ─────────────────────────────
  deploy:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    env:
      SERVER_ADDR: ${{ secrets.SERVER_HOST }}
      SERVER_LOGIN: ${{ secrets.SERVER_USER || 'root' }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || 22 }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
      # Контекст secrets недоступен в step-level if, поэтому раскрываем его здесь.
      HAS_DUCKDNS: ${{ secrets.DUCKDNS_SUBDOMAIN != '' && secrets.DUCKDNS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # SITE_DOMAIN вычисляется здесь, а не в env job'а: в режиме sslip домен
      # выводится из секрета SERVER_HOST, а для этого нужен шелл.
      - name: Resolve site domain
        env:
          SUB: ${{ secrets.DUCKDNS_SUBDOMAIN }}
        run: |
          set -e
          domain=""
          case "$TLS_MODE" in
            fixed)
              if [ -n "$SITE_DOMAIN_FIXED" ]; then
                domain="$SITE_DOMAIN_FIXED"
              else
                echo "::error::TLS_MODE=fixed, но SITE_DOMAIN_FIXED пуст"; exit 1
              fi
              ;;
            sslip)
              # Преобразование работает только для IPv4; для имени хоста оно
              # бессмысленно, поэтому в таком случае остаёмся на HTTP.
              if printf '%s' "$SERVER_ADDR" | grep -qE '^[0-9]+(\.[0-9]+){3}$'; then
                domain="$(printf '%s' "$SERVER_ADDR" | tr '.' '-').sslip.io"
              else
                echo "::warning::SERVER_HOST не IPv4 — режим sslip пропущен, TLS не будет"
              fi
              ;;
            duckdns)
              if [ -n "$SUB" ]; then
                domain="${SUB}.duckdns.org"
              else
                echo "::error::TLS_MODE=duckdns, но секрет DUCKDNS_SUBDOMAIN не задан"; exit 1
              fi
              ;;
            off) ;;
            *) echo "::error::неизвестный TLS_MODE='$TLS_MODE'"; exit 1 ;;
          esac
          echo "SITE_DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "домен для сертификата: ${domain:-<нет, только HTTP>}"

      # DuckDNS не имеет API для регистрации поддомена — его заводят руками через
      # веб-интерфейс. Здесь только обновление IP у уже существующего поддомена.
      # Шаг не обязателен: если токена в секретах нет, A-запись просто остаётся
      # такой, какой её выставили руками, и деплой продолжается.
      - name: Refresh DuckDNS IP
        if: ${{ env.HAS_DUCKDNS == 'true' }}
        env:
          SUB: ${{ secrets.DUCKDNS_SUBDOMAIN }}
          TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          set -e
          resp=$(curl -sS --get "https://www.duckdns.org/update" \
                   --data-urlencode "domains=$SUB" \
                   --data-urlencode "token=$TOKEN" \
                   --data-urlencode "ip=$SERVER_ADDR")
          echo "duckdns: $resp"
          # API отвечает голым "OK" или "KO" — KO означает неверный токен/поддомен
          [ "$resp" = "OK" ] || { echo "::error::DuckDNS вернул '$resp' — проверьте DUCKDNS_SUBDOMAIN и DUCKDNS_TOKEN"; exit 1; }

      # Пакеты ставятся отдельным шагом до заливки файлов: rsync нужен на
      # сервере раньше, чем мы попробуем в него синхронизировать сайт.
      - name: Prepare server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            echo "=== ставим Caddy ==="
            if ! command -v caddy >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq debian-keyring debian-archive-keyring apt-transport-https curl gnupg rsync
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
                | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
                > /etc/apt/sources.list.d/caddy-stable.list
              apt-get update -qq
              apt-get install -y -qq caddy
            else
              command -v rsync >/dev/null 2>&1 || apt-get install -y -qq rsync
            fi
            caddy version

            echo "=== python для бэкенда ==="
            apt-get install -y -qq python3 python3-venv >/dev/null
            python3 --version

            # Бэкенд работает под отдельным системным пользователем, а не под
            # root: у него будет доступ на запись только к своему каталогу
            # данных. Исходники лежат вне /var/www/html — тот каталог
            # синхронизируется с --delete и виден снаружи.
            id -u strapi >/dev/null 2>&1 || \
              useradd --system --home-dir /opt/str-api --shell /usr/sbin/nologin strapi
            mkdir -p /opt/str-api/src /opt/str-api/data

            echo "=== освобождаем порты 80/443 от nginx ==="
            systemctl disable --now nginx >/dev/null 2>&1 || true

            echo "=== открываем порты, если включён ufw ==="
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow 80/tcp  >/dev/null 2>&1 || true
              ufw allow 443/tcp >/dev/null 2>&1 || true
            fi

            mkdir -p /var/www/html

      # Файлы едут rsync'ом, а не через переменную окружения: в site/ лежат
      # шрифты, и base64-упаковка каталога перестала помещаться в окружение
      # ssh-action (~450 КБ против ~1,5 КБ, когда там был один HTML).
      - name: Upload site
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          # sshpass -e берёт пароль из окружения, а не из аргументов,
          # чтобы он не светился в списке процессов раннера.
          sshpass -e rsync -az --delete --stats \
            -e "ssh -p $SERVER_SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site/ "$SERVER_LOGIN@$SERVER_ADDR:/var/www/html/"

      - name: Upload backend
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -e
          sshpass -e rsync -az --delete \
            -e "ssh -p $SERVER_SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            backend/ "$SERVER_LOGIN@$SERVER_ADDR:/opt/str-api/src/"

      - name: Configure Caddy and verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          envs: GITHUB_SHA,SITE_DOMAIN,SERVER_ADDR,ACME_EMAIL
          script: |
            set -e
            printf '%s\n' "$GITHUB_SHA" > /var/www/html/version
            chmod -R a+rX /var/www/html

            echo "=== зависимости бэкенда ==="
            [ -x /opt/str-api/venv/bin/python ] || python3 -m venv /opt/str-api/venv
            /opt/str-api/venv/bin/pip install --quiet --upgrade pip
            /opt/str-api/venv/bin/pip install --quiet -r /opt/str-api/src/requirements.txt
            /opt/str-api/venv/bin/python -c "import fastapi; print('fastapi', fastapi.__version__)"

            echo "=== systemd-юнит ==="
            cat > /etc/systemd/system/str-api.service <<UNIT
            [Unit]
            Description=Str invitation API
            After=network.target

            [Service]
            Type=simple
            User=strapi
            Group=strapi
            WorkingDirectory=/opt/str-api/src
            Environment=APP_VERSION=$GITHUB_SHA
            Environment=STR_DATA_DIR=/opt/str-api/data
            ExecStart=/opt/str-api/venv/bin/uvicorn app:app --host 127.0.0.1 --port 8000
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            UNIT
            # Отступы выше нужны YAML-блоку, systemd их не понимает — срезаем.
            sed -i 's/^[[:space:]]*//' /etc/systemd/system/str-api.service

            chown -R strapi:strapi /opt/str-api
            systemctl daemon-reload
            systemctl enable str-api >/dev/null 2>&1 || true
            systemctl restart str-api

            echo "=== ждём бэкенд на 127.0.0.1:8000 ==="
            api_ok=""
            for i in $(seq 1 25); do
              if curl -fsS -o /dev/null http://127.0.0.1:8000/api/health; then api_ok=1; break; fi
              sleep 2
            done
            if [ -z "$api_ok" ]; then
              echo "::error::бэкенд не поднялся — логи ниже"
              journalctl -u str-api --no-pager -n 60 || true
              exit 1
            fi
            echo "api напрямую: $(curl -fsS http://127.0.0.1:8000/api/health)"

            echo "=== пишем Caddyfile ==="
            # /api/* уходит на uvicorn, всё остальное отдаётся статикой.
            site_block() {
              printf '%s {\n' "$1"
              printf '\tencode gzip\n'
              printf '\thandle /api/* {\n\t\treverse_proxy 127.0.0.1:8000\n\t}\n'
              printf '\thandle {\n\t\troot * /var/www/html\n\t\tfile_server\n\t}\n'
              printf '}\n\n'
            }
            if [ -n "$SITE_DOMAIN" ]; then
              # Адрес сервера прописывается явно, а не как ':80' — блок без
              # host-матчера затенил бы маршруты домена.
              {
                if [ -n "$ACME_EMAIL" ]; then printf '{\n\temail %s\n}\n\n' "$ACME_EMAIL"; fi
                site_block "$SITE_DOMAIN"
                # Редирект прописан явно: наличие блока http://<IP> на :80 отключает
                # автогенерацию редиректа для домена.
                printf 'http://%s {\n\tredir https://%s{uri} permanent\n}\n\n' "$SITE_DOMAIN" "$SITE_DOMAIN"
                site_block "http://$SERVER_ADDR"
              } > /etc/caddy/Caddyfile
            else
              site_block ":80" > /etc/caddy/Caddyfile
            fi
            caddy fmt --overwrite /etc/caddy/Caddyfile || true
            caddy validate --config /etc/caddy/Caddyfile

            echo "=== запускаем Caddy ==="
            systemctl enable caddy >/dev/null 2>&1 || true
            systemctl restart caddy
            sleep 2

            echo "=== health check по HTTP ==="
            # Стучимся в 127.0.0.1 с подменой Host: у Caddy блоки разделены по
            # имени хоста, а обращение к внешнему IP с самого сервера упирается
            # в hairpin-NAT не на каждом хостинге.
            H="-H Host:$SERVER_ADDR"
            curl -fsS -o /dev/null $H http://127.0.0.1/ && echo "index: OK"
            echo "healthz: $(curl -fsS $H http://127.0.0.1/healthz)"
            echo "version: $(curl -fsS $H http://127.0.0.1/version)"
            echo "api через Caddy: $(curl -fsS $H http://127.0.0.1/api/health)"

            if [ -n "$SITE_DOMAIN" ]; then
              echo "=== ждём сертификат для $SITE_DOMAIN ==="
              ok=""
              for i in $(seq 1 20); do
                if curl -fsS -o /dev/null --max-time 10 "https://$SITE_DOMAIN/healthz"; then
                  ok=1; echo "TLS: сертификат выпущен, HTTPS отвечает"; break
                fi
                sleep 15
              done
              if [ -z "$ok" ]; then
                echo "::error::HTTPS не поднялся за 5 минут — логи ниже"
                journalctl -u caddy --no-pager -n 60 || true
                exit 1
              fi

              # Логи Actions в этом окружении недоступны, поэтому итог выпуска
              # сертификата выкладывается рядом с сайтом: издателя видно снаружи
              # обычным curl. Данные и так публичны (CT-логи).
              echo | openssl s_client -connect "$SITE_DOMAIN:443" -servername "$SITE_DOMAIN" 2>/dev/null \
                | openssl x509 -noout -issuer -subject -dates > /var/www/html/tls-status 2>/dev/null || true
              printf 'checked_from=server\ndomain=%s\n' "$SITE_DOMAIN" >> /var/www/html/tls-status
              echo "--- tls-status ---"; cat /var/www/html/tls-status
            fi

            echo "=== статус Caddy ==="
            systemctl is-active caddy

  # ── INSPECT: только осмотреть сервер, ничего не менять ──────────────────────
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'inspect' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "=== OS ==="; (cat /etc/os-release | head -2) 2>&1 || true
            echo "=== whoami ==="; whoami
            echo "=== listening 80/443 ==="; (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ':80 |:443 ' || echo "nothing on 80/443"
            echo "=== caddy ==="; (caddy version 2>&1; systemctl is-active caddy 2>/dev/null) || echo "caddy: NOT installed"
            echo "=== nginx ==="; (systemctl is-active nginx 2>/dev/null) || echo "nginx: не запущен"
            echo "=== Caddyfile ==="; (cat /etc/caddy/Caddyfile 2>/dev/null) || echo "нет Caddyfile"
            echo "=== сертификаты ==="; (find /var/lib/caddy -name '*.crt' 2>/dev/null | head) || echo "нет сертификатов"
            echo "=== содержимое сайта ==="; (ls -la /var/www/html | head -20) || true
            echo "=== version ==="; (cat /var/www/html/version 2>/dev/null) || echo "no version file"
            echo "=== disk ==="; df -h / | tail -1
