name: Deploy to server

# Деплой статического сайта из каталога site/ на сервер по SSH силами раннеров GitHub.
# Ставит nginx через apt и отдаёт содержимое site/ на порту 80.
# Docker не используется (тянуть образы с Docker Hub на этом сервере нестабильно).
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SERVER_HOST      — IP/домен сервера (например 91.212.150.225)   [обязательно]
#   SERVER_PASSWORD  — пароль SSH                                    [обязательно]
#   SERVER_USER      — пользователь SSH (по умолчанию root)          [опционально]
#   SERVER_PORT      — порт SSH (по умолчанию 22)                    [опционально]

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать на сервере"
        type: choice
        options: [deploy, inspect]
        default: deploy

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  # ── DEPLOY: выложить содержимое site/ на сервер ─────────────────────────────
  deploy:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack site
        run: |
          echo "SITE_B64=$(tar -czf - -C site . | base64 -w0)" >> "$GITHUB_ENV"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          envs: SITE_B64,GITHUB_SHA
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            echo "=== nginx + rsync через apt ==="
            apt-get update -qq
            apt-get install -y -qq nginx rsync
            echo "=== распаковываем сайт ==="
            rm -rf /tmp/str-site
            mkdir -p /tmp/str-site /var/www/html
            echo "$SITE_B64" | base64 -d | tar -xzf - -C /tmp/str-site
            printf '%s\n' "$GITHUB_SHA" > /tmp/str-site/version
            rsync -a --delete /tmp/str-site/ /var/www/html/
            chmod -R a+r /var/www/html
            echo "=== запускаем nginx ==="
            systemctl enable nginx >/dev/null 2>&1 || true
            systemctl restart nginx
            sleep 1
            echo "=== health check ==="
            curl -fsS -o /dev/null http://127.0.0.1/ && echo "index: OK"
            echo "healthz: $(curl -fsS http://127.0.0.1/healthz)"
            echo "version: $(curl -fsS http://127.0.0.1/version)"
            echo "=== nginx status ==="
            systemctl is-active nginx

  # ── INSPECT: только осмотреть сервер, ничего не менять ──────────────────────
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'inspect' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "=== OS ==="; (cat /etc/os-release | head -2) 2>&1 || true
            echo "=== whoami ==="; whoami
            echo "=== listening 80/443 ==="; (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ':80 |:443 ' || echo "nothing on 80/443"
            echo "=== nginx ==="; (nginx -v 2>&1; systemctl is-active nginx 2>/dev/null) || echo "nginx: NOT installed"
            echo "=== who answers :80 ==="; (curl -sS -i http://127.0.0.1/ 2>&1 | head -8) || true
            echo "=== version ==="; (cat /var/www/html/version 2>/dev/null) || echo "no version file"
            echo "=== disk ==="; df -h / | tail -1
