<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ростер — админка</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<style>
  :root {
    --navy: #0c1b3d; --ink: #12141c; --red: #d31145;
    --gold: #ffc647; --cream: #f5efe0; --line: rgba(245,239,224,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--navy); color: var(--cream);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { opacity: 0.6; font-size: 13px; margin-bottom: 24px; }
  .sub a { color: var(--gold); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card .n { font-size: 28px; font-weight: 700; color: var(--gold); line-height: 1; }
  .card .c { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.55; margin-top: 8px; }

  .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .btn {
    background: var(--gold); color: var(--navy); border: none;
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block;
  }
  .btn.ghost { background: transparent; color: var(--cream); border: 1px solid var(--line); }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 13px; }
  th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--ink); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: center; }
  .public { color: var(--gold); font-size: 12px; white-space: nowrap; }
  .muted { opacity: 0.5; font-size: 12px; }
  .allerg { color: #ffb4b4; }
  .act { display: flex; gap: 6px; }
  .act button {
    background: transparent; border: 1px solid var(--line); color: var(--cream);
    border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .act button.del:hover { background: var(--red); border-color: var(--red); }
  .empty { padding: 40px; text-align: center; opacity: 0.5; }
  .h2 { font-size: 16px; margin: 28px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.8; }
  #bar-table { min-width: 520px; }
  #bar-table td.buy { color: var(--gold); font-weight: 700; white-space: nowrap; }
  .bar-note { font-size: 13px; opacity: 0.65; margin-bottom: 12px; line-height: 1.5; }
  .norms { font-size: 12px; opacity: 0.6; margin-bottom: 8px; }
  .norms summary { cursor: pointer; }
  .norms div { padding: 10px 0 0 4px; line-height: 1.7; }
  .custom { color: var(--gold); }
  .tg { background: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 8px; font-size: 13px; line-height: 1.7; }
  .tg a { color: var(--gold); }
  .tg .bad { color: #ff9a9a; }
  .tg .good { color: var(--gold); }
  .err { background: rgba(211,17,69,0.2); border: 1px solid var(--red); border-radius: 10px; padding: 14px; margin-bottom: 18px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ростер — админка</h1>
  <div class="sub">Полные данные гостей. Публично видно только то, что в колонке «В списке». · <a href="/">к приглашению</a></div>

  <div class="err" id="err"></div>

  <div class="cards" id="cards"></div>

  <div class="bar">
    <a class="btn" href="/api/admin/guests.csv">Скачать CSV</a>
    <button class="btn ghost" id="reload">Обновить</button>
  </div>

  <h2 class="h2">Telegram</h2>
  <div class="tg" id="tg"></div>

  <h2 class="h2">Закупка бара</h2>
  <div class="bar-note" id="bar-note"></div>
  <div class="table-scroll" style="margin-bottom:12px">
    <table id="bar-table">
      <thead>
        <tr><th>Позиция</th><th>Человек</th><th>Объём</th><th>Купить</th></tr>
      </thead>
      <tbody id="bar-rows"></tbody>
    </table>
  </div>
  <details class="norms">
    <summary>Из чего считается</summary>
    <div id="norms"></div>
  </details>

  <h2 class="h2">Заявки</h2>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Имя</th><th>В списке</th><th>Гостей</th><th>Напиток</th>
          <th>Готовность</th><th>Аллергии</th><th>Сообщение</th><th>Своё</th><th>Записался</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" style="display:none">Заявок пока нет</div>
</div>

<script>
  const rowsEl = document.getElementById('rows');
  const cardsEl = document.getElementById('cards');
  const emptyEl = document.getElementById('empty');
  const errEl = document.getElementById('err');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function showErr(t) { errEl.textContent = t; errEl.style.display = 'block'; }

  function when(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  async function loadTelegram() {
    const el = document.getElementById('tg');
    let d;
    try {
      const res = await fetch('/api/admin/telegram');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      d = await res.json();
    } catch (e) { el.innerHTML = '<span class="bad">Не удалось опросить бота: ' + esc(e.message) + '</span>'; return; }

    if (!d.configured) {
      el.innerHTML = '<span class="bad">Бот не настроен: нет секрета TELEGRAM_BOT_TOKEN '
                   + 'либо Telegram не ответил при деплое.</span>';
      return;
    }
    let h = `Бот: <b>@${esc(d.bot)}</b> · подключились гостей: ${esc(d.guests_linked)} из ${esc(d.guests_total)}<br>`;
    h += `Очередь: ждут отправки ${esc(d.queue_pending)}, отправлено ${esc(d.queue_sent)}`;
    if (d.queue_stuck) h += `, <span class="bad">брошено после 5 попыток: ${esc(d.queue_stuck)}</span>`;
    h += d.last_sent_at ? ` · последняя отправка ${esc(when(d.last_sent_at))}<br>` : '<br>';
    h += '<span class="muted">Сервер не может писать в Telegram — провайдер блокирует. '
       + 'Сообщения уходят задачей GitHub Actions раз в час, поэтому ответы бота приходят с задержкой.</span><br>';
    if (d.host_linked) {
      h += '<span class="good">✓ ваш чат привязан</span> · <button class="btn ghost" id="tg-test" style="margin-left:8px">Тестовое сообщение</button>';
    } else {
      h += `Ваш чат не привязан. Откройте ссылку и нажмите «Старт»: <a href="${esc(d.host_link)}" target="_blank" rel="noopener">${esc(d.host_link)}</a> `;
      h += '<span class="muted">(ссылка одноразовая)</span>';
    }
    el.innerHTML = h;

    const btn = document.getElementById('tg-test');
    if (btn) btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = 'Отправляю...';
      const res = await fetch('/api/admin/telegram/test', { method: 'POST' });
      const body = await res.json().catch(() => ({}));
      btn.textContent = res.ok ? 'В очереди ✓ уйдёт в течение часа' : 'Ошибка: ' + (body.detail || res.status);
      btn.disabled = false;
    });
  }

  async function loadBar() {
    let d;
    try {
      const res = await fetch('/api/admin/bar');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      d = await res.json();
    } catch (e) { return showErr('Не удалось посчитать бар: ' + e.message); }

    let note = `Считаем по головам: выбор гостя умножается на размер его компании — что пьют спутники, форма не спрашивает. Из ${d.people_total} человек в расчёт вошли ${d.people_counted}`;
    note += d.people_bring_own ? `, ещё ${d.people_bring_own} принесут своё.` : '.';
    document.getElementById('bar-note').textContent = note;

    const rows = d.shopping.map(r => `
      <tr><td>${esc(r.drink)}</td><td class="num">${esc(r.people)}</td>
          <td>${esc(r.volume_l)} л</td>
          <td class="buy">${esc(r.amount)} ${esc(r.label)}</td></tr>`);
    for (const c of d.custom) {
      rows.push(`<tr><td class="custom">${esc(c.drink)}</td><td class="num">${esc(c.people)}</td>
                 <td colspan="2" class="muted">свой вариант гостя — нормы нет, решить вручную</td></tr>`);
    }
    document.getElementById('bar-rows').innerHTML = rows.join('')
      || '<tr><td colspan="4" class="muted">Пока нечего закупать</td></tr>';

    document.getElementById('norms').innerHTML = d.norms.map(n =>
      `${esc(n.drink)} — ${esc(n.per_person_ml)} мл на человека, считаем в ${esc(n.label)}`
    ).join('<br>') + '<br>Соки и тоники — 750 мл на каждого, кто выбрал коктейли.';
  }

  async function load() {
    errEl.style.display = 'none';
    let data;
    try {
      const res = await fetch('/api/admin/guests');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
    } catch (e) {
      showErr('Не удалось загрузить список: ' + e.message);
      return;
    }

    cardsEl.innerHTML = [
      [data.entries, 'заявок'],
      [data.people, 'человек придёт'],
      [data.avg_hype, 'средняя готовность'],
      [data.with_allergies, 'с ограничениями в еде']
    ].map(([n, c]) => `<div class="card"><div class="n">${esc(n)}</div><div class="c">${esc(c)}</div></div>`).join('');

    emptyEl.style.display = data.guests.length ? 'none' : 'block';
    rowsEl.innerHTML = data.guests.map((g, i) => `
      <tr>
        <td class="muted">${esc(g.id)}</td>
        <td><b>${esc(g.name)}</b></td>
        <td class="public">${esc(data.public_preview[i])}</td>
        <td class="num">${esc(g.guests_count)}</td>
        <td>${esc(g.drink)}</td>
        <td class="num">${esc(g.hype)}</td>
        <td class="allerg">${esc(g.allergies)}</td>
        <td>${esc(g.message)}</td>
        <td class="num">${g.brings_own ? '✓' : ''}</td>
        <td class="muted">${esc(when(g.created_at))}</td>
        <td><div class="act">
          <button data-rename="${esc(g.id)}" data-name="${esc(g.name)}">Имя</button>
          <button class="del" data-del="${esc(g.id)}" data-name="${esc(g.name)}">Удалить</button>
        </div></td>
      </tr>`).join('');
  }

  rowsEl.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button');
    if (!btn) return;

    if (btn.dataset.del) {
      if (!confirm(`Удалить заявку «${btn.dataset.name}»? Это необратимо.`)) return;
      const res = await fetch('/api/admin/guests/' + btn.dataset.del, { method: 'DELETE' });
      if (!res.ok) return showErr('Не удалось удалить: HTTP ' + res.status);
      loadAll();
    }

    if (btn.dataset.rename) {
      // Пригодится, если гость написал фамилию первой: тогда в публичный
      // список попадает фамилия целиком.
      const name = prompt('Имя и фамилия (в списке покажется имя + инициал):', btn.dataset.name);
      if (name === null) return;
      const res = await fetch('/api/admin/guests/' + btn.dataset.rename, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      if (!res.ok) return showErr('Не удалось переименовать: HTTP ' + res.status);
      loadAll();
    }
  });

  function loadAll() { load(); loadBar(); loadTelegram(); }
  document.getElementById('reload').addEventListener('click', loadAll);
  loadAll();
</script>
</body>
</html>
